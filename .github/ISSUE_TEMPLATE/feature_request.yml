name: Feature Request
description: Suggest a new feature or improvement for the RealEye.io platform
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea! Before submitting, please check [existing feature requests](../../issues?q=label%3Aenhancement) and [Discussions – Ideas](../../discussions/categories/ideas) to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you are experiencing. A clear problem statement helps us understand the need.
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds or alternative solutions? What were their limitations?

  - type: dropdown
    id: area
    attributes:
      label: Platform area
      description: Which part of the platform does this relate to?
      options:
        - Study creation
        - Calibration
        - Participant experience
        - Data analysis & reporting
        - Integrations
        - Account & billing
        - API
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or examples that help illustrate the feature.
